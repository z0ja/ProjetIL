<!DOCTYPE html>

<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Connexion — W2G</title>
    <link href="../assets/css/bootstrap-icons.css" rel="stylesheet">
    <link href="../assets/css/styles.css" rel="stylesheet" crossorigin="anonymous">
    <link href="https://fonts.googleapis.com/css2?family=DM+Mono:wght@300;400;500&family=Syne:wght@400;600;700;800&display=swap" rel="stylesheet">

    <style>
        :root {
            --bg:       #f4f5f7;
            --surface:  #ffffff;
            --surface2: #f0f2f5;
            --border:   #e2e5eb;
            --border2:  #cdd2da;
            --navy:     #0f1f3d;
            --navy2:    #1a3260;
            --accent:   #2563eb;
            --accent2:  #0ea5e9;
            --success:  #10b981;
            --danger:   #ef4444;
            --text:     #0f1f3d;
            --muted:    #64748b;
            --mono:     'DM Mono', monospace;
            --display:  'Syne', sans-serif;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; }

        body {
            background: var(--bg);
            font-family: var(--display);
            height: 100vh;
            display: flex;
            flex-direction: column;
        }

        /* NAV */
        .nav-bar {
            height: 54px;
            display: flex;
            align-items: center;
            padding: 0 20px;
            background: var(--surface);
            border-bottom: 1px solid var(--border);
        }

        .nav-logo {
            font-family: var(--mono);
            font-size: .95rem;
            letter-spacing: .08em;
            color: var(--navy);
            text-decoration: none;
            display: flex;
            align-items: center;
            gap: 7px;
        }

        .nav-logo-dot {
            width: 7px;
            height: 7px;
            border-radius: 50%;
            background: var(--accent);
        }

        /* CONTAINER */
        .login-container {
            flex: 1;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .login-box {
            width: 100%;
            max-width: 360px;
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: 12px;
            padding: 28px;
            box-shadow: 0 10px 30px rgba(15,31,61,.08);
        }

        .login-title {
            font-size: 1.1rem;
            font-weight: 700;
            color: var(--navy);
            margin-bottom: 18px;
        }

        .form-group {
            margin-bottom: 14px;
        }

        .form-label {
            font-family: var(--mono);
            font-size: .65rem;
            color: var(--muted);
            display: block;
            margin-bottom: 5px;
            text-transform: uppercase;
            letter-spacing: .08em;
        }

        .form-input {
            width: 100%;
            background: var(--bg);
            border: 1px solid var(--border);
            padding: 9px 11px;
            border-radius: 6px;
            font-family: var(--mono);
            font-size: .8rem;
            outline: none;
            transition: border-color .15s;
        }

        .form-input:focus {
            border-color: var(--accent);
        }

        .form-input::placeholder {
            color: var(--border2);
        }

        .login-btn {
            width: 100%;
            margin-top: 10px;
            background: var(--navy);
            color: #fff;
            border: none;
            padding: 10px;
            border-radius: 6px;
            font-family: var(--mono);
            font-size: .75rem;
            font-weight: 700;
            cursor: pointer;
            transition: background .15s;
        }

        .login-btn:hover {
            background: var(--navy2);
        }

        .login-footer {
            margin-top: 14px;
            text-align: center;
            font-size: .72rem;
            color: var(--muted);
        }

        .login-footer a {
            color: var(--accent);
            text-decoration: none;
        }

        .login-footer a:hover {
            text-decoration: underline;
        }

        .error-msg {
            display: none;
            background: rgba(239,68,68,.08);
            border: 1px solid rgba(239,68,68,.3);
            color: var(--danger);
            font-size: .72rem;
            padding: 6px 8px;
            border-radius: 5px;
            margin-bottom: 10px;
        }
    </style>
</head>
<body>

    <nav class="nav-bar">
        <a class="nav-logo" href="../index.html">
            <div class="nav-logo-dot"></div>W2G
        </a>
    </nav>

    <div class="login-container">
        <div class="login-box">
        <form>

            <div class="login-title">Connexion</div>

            <div class="error-msg" id="errorMsg">Identifiants invalides</div>

            <div class="form-group">
                <label class="form-label">Email</label>
                <input type="email" id="loginEmail" class="form-input" placeholder="ex: user@mail.com">
            </div>

            <div class="form-group">
                <label class="form-label">Mot de passe</label>
                <input type="password" id="loginPassword" class="form-input" placeholder="••••••••">
            </div>

            <button class="login-btn" type="submit">
                <i class="bi bi-box-arrow-in-right"></i> Se connecter
            </button>

            <div class="login-footer">
                Pas encore de compte ?
                <a href="register.html">Créer un compte</a>
            </div>

        </form>
    </div>

    </div>

    <script src="../assets/js/login.js"></script>

</body>
</html>
